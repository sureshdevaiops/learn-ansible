- name: install and start nginx
  hosts: frontend
  become: yes # providing sudoe access
  tasks:
  - name: install nginx
    package:
      name: nginx
      state: present
  - name: state the ngix service
    service:
      name: nginx 
      state: started
      enabled: yes




